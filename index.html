<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment Status</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f1115;color:#e8e8e8;font-family:system-ui,sans-serif;text-align:center;padding:16px}
  .box{max-width:360px}
  a.btn{display:inline-block;margin-top:16px;padding:12px 22px;background:#229ed9;color:#fff;border-radius:10px;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<div class="box">
  <h2 id="t">পেমেন্ট প্রসেস হচ্ছে...</h2>
  <p id="m">অনুগ্রহ করে অপেক্ষা করুন, আপনাকে টেলিগ্রাম বটে ফেরত নেওয়া হচ্ছে।</p>
  <a id="b" class="btn" style="display:none" href="#">বটে ফিরে যান</a>
</div>
<script>
  var href = window.location.href;
  var bm = href.match(/[?&]b=([A-Za-z0-9_]{3,64})/);
  var tm = href.match(/transaction[_]?id=([A-Za-z0-9_\-]{4,64})/i);
  var sm = href.match(/status=([A-Za-z]+)/i);
  var status = sm ? sm[1].toLowerCase() : "";
  var btn = document.getElementById("b");

  if (!bm) {
    document.getElementById("t").textContent = "লিংকটি সঠিক নয়";
    document.getElementById("m").textContent = "বট থেকে নতুন করে ডিপোজিট শুরু করুন।";
  } else if (tm && status !== "failed" && status !== "cancel" && status !== "cancelled") {
    var link = "https://t.me/" + bm[1] + "?start=pay_" + tm[1];
    btn.href = link;
    btn.style.display = "inline-block";
    window.location.href = link;
  } else {
    document.getElementById("t").textContent = "পেমেন্ট সম্পন্ন হয়নি";
    document.getElementById("m").textContent = "পেমেন্ট বাতিল বা ব্যর্থ হয়েছে। বটে ফিরে আবার চেষ্টা করুন।";
    btn.href = "https://t.me/" + bm[1];
    btn.style.display = "inline-block";
  }
</script>
</body>
</html>
